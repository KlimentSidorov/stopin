[project]
name = "ai-access-gateway"
version = "0.1.0"
description = "A policy gateway for protected web and API origins"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

adversarial = [
    "pytest>=8.0,<9.0",
    "requests>=2.32,<3.0",
    "playwright>=1.48,<2.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
