name: Gateway security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e '.[test,adversarial]' pip-audit
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: examples/nextjs-origin
      - run: python -m pytest -p no:cacheprovider
      - run: python -m pip_audit -r requirements.lock
      - run: docker build -t stopin:test .
